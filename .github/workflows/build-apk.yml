name: Build zyChat Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build zyChat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Prepare Android Project & Assets
        run: |
          mkdir -p app/src/main/assets/www
          cp -r dist/* app/src/main/assets/www/
          if [ -d "android" ]; then
            mkdir -p android/app/src/main/assets/www
            cp -r dist/* android/app/src/main/assets/www/
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APK with Gradle
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          elif [ -f "android/gradlew" ]; then
            cd android && ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find and Organize Output APK
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -not -path "*/output_apk/*" -exec cp {} output_apk/zyChat-debug.apk \;
          echo "Ditemukan APK:"
          ls -lh output_apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyChat-Android-APK
          path: output_apk/*.apk
          retention-days: 14

      - name: Create GitHub Release (Optional)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "zyChat Fake WhatsApp APK"
          body: "Base APK zyChat - WhatsApp Fake Experience siap diinstall di perangkat Android."
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
